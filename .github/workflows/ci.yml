name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端检查与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: insurance
          POSTGRES_PASSWORD: insurance-ci
          POSTGRES_DB: insurance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insurance -d insurance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://insurance:insurance-ci@localhost:5432/insurance_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent-service/uv.lock

      - name: 安装依赖
        run: uv sync --locked

      - name: 安装 PostgreSQL 客户端
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 初始化测试库
        env:
          PGPASSWORD: insurance-ci
        run: |
          for f in ../deploy/postgres/init/*.sql; do
            psql -h localhost -U insurance -d insurance_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: ruff 代码检查
        run: uv run ruff check app scripts tests evals

      - name: ruff 格式检查
        run: uv run ruff format --check app scripts tests evals

      - name: pyright 类型检查
        run: uv run pyright

      - name: pytest
        run: uv run pytest -q

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: agent-service
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
